# T06 variant: T06_e5 + group-relative E5 features (gap to best cosine and rank within each S1 entity).
# model: intfloat/multilingual-e5-small, licence: MIT, params: ~118M (exact count logged by p4_e5 at load)
inherit: ../../best_r2.yaml
features:
  - name: string_sims
    params: {fields: [name_norm, name_core, addr_norm]}
  - name: p4_e5
    params: {model: intfloat/multilingual-e5-small, fields: [name, addr, full], max_length: 64, batch_size: 512,
             group_feats: true}
