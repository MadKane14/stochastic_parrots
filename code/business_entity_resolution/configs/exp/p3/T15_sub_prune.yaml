# T15 (p3) — T15_sub (T10_e5 + empty-address channel) with p1's learned pruning stage (T11_prune). The stage-1
# features gain the channel's own blocker columns (blk_1_score, blk_1_rank): pairs proposed only by the channel have
# blk_0_* = NaN and, having no address, weak address features, so without blk_1_* the pruner cannot tell them apart
# from junk. Everything else = p1/T11_prune.yaml (the list is replaced as a whole on inheritance, so it is repeated).
inherit: ../p1/T11_prune.yaml
blocking:
  max_candidates: null
  blockers:
    - name: p1_compound          # = T09_tr / T10_e5
      params: {k: 30, k_rev: 3, max_df: 1000}
    - name: p3_chargram          # empty-address channel; transductive (IDF/df caps on the records being blocked)
      params: {field: name_norm, ngrams: [3, 4], words: true, right_max_addr_tokens: 0, k: 2, k_rev: 5,
               max_df: 5000}
prune:
  features: [blk_0_score, blk_0_rank, blk_1_score, blk_1_rank, f_p1_name_tset, f_p1_addr_tset, f_p1_idf_n_jacc,
             f_p1_idf_w_jacc, f_p1_num_shared, f_p1_num_first_eq, f_p1_grp_s1_key_rank, f_p1_grp_rec_key_rank,
             f_p1_grp_s1_key_margin, f_p1_grp_rec_key_margin]
