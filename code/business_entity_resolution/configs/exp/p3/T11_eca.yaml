# T11 (p3) — both p3 channels (empty-address name channel T11_e + name-gram/address channel T11_ca) on T09_tr.
inherit: T11_base.yaml
blocking:
  max_candidates: null
  blockers:
    - name: p1_compound          # = T09_tr
      params: {k: 30, k_rev: 3, max_df: 1000}
    - name: p3_chargram          # empty-address channel (= T11_e)
      params: {field: name_norm, ngrams: [3, 4], words: true, right_max_addr_tokens: 0, k: 2, k_rev: 5,
               max_df: 5000}
    - name: p3_chargram          # name grams + address tokens (= T11_ca)
      params: {field: name_norm, ngrams: [3, 4], addr_field: addr_norm, addr_weight: 1.0, k: 15, k_rev: 1, max_df: 3000}
