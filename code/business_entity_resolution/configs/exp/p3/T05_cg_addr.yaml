# T05 (p3) — char-gram channel on name + address tokens. Hypothesis: as T05_cg_name, but the bag also holds the
# address tokens (numbers + words, p1_compound tokenisation), so a typo'd / glued name still ranks high when the
# address overlaps even partially — the name grams alone are weakly selective in 5M-record country groups (I-07).
inherit: ../../best.yaml
blocking:
  max_candidates: 50
  blockers:
    - name: p1_compound          # = best.yaml
      params: {k: 30, k_rev: 3, max_df: 1000}
    - name: p3_chargram          # transductive: IDF/df caps computed on the records being blocked
      params: {field: name_norm, ngrams: [3, 4], addr_field: addr_norm, addr_weight: 1.0, k: 15, k_rev: 1, max_df: 3000}
