# T04 (p2) variant A — main hypothesis. Normalizer p2_translit, mode=replace, all steps on:
# learned native->Latin token map (competitive linking on train true pairs, Brahmic scripts folded to one layout),
# address map, bare-domain names -> first label, unigram segmentation of long rare tokens, 1/0 -> l/o variants,
# joined single-letter runs. Hypothesis: full-density pair recall of best.yaml's blocker +>= 0.005 (T04).
# Thresholds fixed a priori (min_support 3, min_precision 0.5); not tuned on evaluation data.
# transductive: segmentation vocabulary also counts name tokens of the records being normalized (no labels).
inherit: ../../best_r2.yaml
normalize:
  name: p2_translit
  params: {legal_tokens: [inc, llc, ltd, pvt, private, limited, corp, corporation, co, company, plc, llp], mode: replace, min_support: 3, min_precision: 0.5, fold_scripts: true,
           map_address: true, web_names: true, join_initials: true}
