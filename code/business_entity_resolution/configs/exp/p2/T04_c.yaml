# T04 (p2) ablation C — as A but ONLY the learned native->Latin maps (no web-name / segmentation / initials steps):
# isolates the cross-script contribution.
inherit: ../../best_r2.yaml
normalize:
  name: p2_translit
  params: {legal_tokens: [inc, llc, ltd, pvt, private, limited, corp, corporation, co, company, plc, llp], mode: replace, min_support: 3, min_precision: 0.5, fold_scripts: true,
           map_address: true, web_names: false, join_initials: false}
