# T13 (p1) — submission #5 candidate: T13_sub4 with the E5 encoder contrastively fine-tuned on ALL train pairs
# (p4's recipe, exploration/p4/e5_finetune.py --split full; model: intfloat/multilingual-e5-small, MIT, 117,653,760
# params, weights fine-tuned only on the provided train data). Use only if the dense LOCO India fold with the
# US-only fine-tuned model (T10_e5 --loco --tag ftUS) beats pretrained.
inherit: T13_sub4.yaml
features:
  - name: p1_match
    params: {idf_group: country}
  - name: p1_extra
    params: {idf_group: country}
  - name: p1_e5
    params: {fields: [name, full], model: /scratch2/madhur.kankane/ber_artifacts/models/ft_full}
  - name: p1_noise
    params: {unsup: true}
