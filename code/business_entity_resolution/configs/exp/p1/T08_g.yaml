# T08 (p1) — cross-country generalisation: IDF within equal-country-string groups + boilerplate-free "core"
# token features (tokens common within their own group dropped; learned from data, no lists) + p1_extra.
# Hypothesis: leave-one-country-out dense-CV F0.5 rises clearly above T03_sub's 0.90504 without hurting the
# hash-fold dense CV (0.96961). Same fast scorer as T03_sub for comparability.
inherit: T03_sub.yaml
features:
  - name: p1_match
    params: {idf_group: country}
  - name: p1_extra
    params: {idf_group: country}
