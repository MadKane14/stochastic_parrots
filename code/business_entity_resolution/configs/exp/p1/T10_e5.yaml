# with rank/gap within S1 and within record). model: intfloat/multilingual-e5-small, licence: MIT, params: 117,653,760.
# Hypothesis (p4 T06: xc_India@0.1 +0.023): dense CV AND dense LOCO rise over T09_tr, LOCO (unseen country) most.
