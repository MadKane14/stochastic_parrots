# T14b (p1) — T14a with the E5 encoder contrastively fine-tuned on all train pairs (p4's v1 recipe; reports/p4/T16.md:
# naive use ties cross-fitting, v1 transfers best to an unseen country). model: intfloat/multilingual-e5-small
# (MIT, 117,653,760 params), fine-tuned only on the provided train data.
inherit: T14a.yaml
features:
  - name: p1_match
    params: {idf_group: country}
  - name: p1_extra
    params: {idf_group: country}
  - name: p1_e5
    params: {fields: [name, full], model: /scratch2/madhur.kankane/ber_artifacts/models/ft_full}
  - name: p1_noise
    params: {unsup: true}
