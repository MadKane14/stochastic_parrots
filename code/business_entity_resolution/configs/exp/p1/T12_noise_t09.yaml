# T12 (p1) — T09_tr + p1_noise (learned noise-token rates from train true pairs: unexplained added / dropped words,
# and which competing S1 explains an S2/S3 record best). Hypothesis: fewer name-only records lost to a sibling S1 /
# below threshold → dense CV up over T09_tr.
inherit: T09_tr.yaml
features:
  - name: p1_match
    params: {idf_group: country}
  - name: p1_extra
    params: {idf_group: country}
  - name: p1_noise
    params: {}
